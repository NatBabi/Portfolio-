<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Portfolio-Home</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@600;700;800&family=Poppins:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    />

    <link rel="stylesheet" href="Styles.css" />
  </head>
  <body>
    <div class="settings-icon" onclick="toggleDarkMode()" title="Toggle Dark/Light Mode" aria-label="Toggle Dark/Light Mode">
      <i class="fa-solid fa-moon" id="themeIcon"></i>
    </div>
    <div class="container">
      <div class="profile">
        
        <div class="profile-container">
          <div class="profile-pic-wrapper">
            <img
              src="Icons/ProfilePicturepng.jpg"
              alt="Profile Picture"
              class="profile-pic"
            />
          </div>

          <div class="profile-text">
            <h2>Natnael Tilahun</h2>
            <p>Computer Science Graduate</p>
            <div class="socials">
              <a href="https://www.linkedin.com/in/Nat-tile"><i class="fa-brands fa-linkedin"></i></a>
              <a href="https://github.com/NatBabi"><i class="fa-brands fa-github"></i></a>
              <a href="https://x.com/NTilahun14"><i class="fa-brands fa-x-twitter"></i></a>
            </div>
          </div>

        </div>

        <!-- About Section -->
        <div class="about">
          <div class="stats">
            <div><strong>2</strong><br />Years of Work Experience</div>
            <div><strong>10+</strong><br />Completed projects</div>
          </div>
        </div>

        <div class="buttons">
          <button class="download" onclick="downloadCV()">Download CV  <i class="fa-solid fa-download"></i></button>
          <button class="btn-secondary" onclick="openContactModal()">
            Contact Me
          </button>
        </div>

        <!-- Contact Modal -->
      <div id="contactModal" class="modal" role="dialog" aria-modal="true" aria-labelledby="contactModalTitle">
        <div class="modal-content">
          <span class="close-button" onclick="closeModal()" aria-label="Close">×</span>
          <h2 id="contactModalTitle">Contact Me</h2>
          <form id="contactForm">
            <input type="hidden" name="_captcha" value="false" />
            <div class="form-group">
              <label for="contactName">Name</label>
              <input type="text" placeholder="e.g. John Doe" name="name" id="contactName" required maxlength="100" />
              <span class="field-error" id="nameError"></span>
            </div>
            <div class="form-group">
              <label for="contactEmail">Email</label>
              <input type="email" placeholder="e.g. john@example.com" name="email" id="contactEmail" required maxlength="254" />
              <span class="field-error" id="emailError"></span>
            </div>
            <div class="form-group">
              <label for="contactMessage">Message</label>
              <textarea placeholder="How can I help you?" rows="4" name="message" id="contactMessage" required maxlength="2000"></textarea>
              <span class="field-error" id="messageError"></span>
            </div>
            <button type="submit" class="btn-primary" id="submitBtn">Send Message</button>
          </form>
        </div>
      </div>

      <!-- Modal for Portfolio -->
      <div id="portfolioModal" class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
        <div class="modal-content">
          <span class="close-button" onclick="closeModal()" aria-label="Close">×</span>
          <img id="modalImage" src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg'/%3E" alt="Project Image" />
          <h2 id="modalTitle">Project</h2>
          <p id="modalDescription">Project Description</p>
          <div id="modalTechStack" class="tech-stack"></div>
          <div id="modalGithubLink" style="margin-top: 15px;"></div>
        </div>
      </div>

      <div class="tabs">
        <button class="active" onclick="switchTab('portfolio')">
          Portfolio
        </button>
        <button onclick="switchTab('skills')">Skills</button>
      </div>

      <!-- Portfolio Section -->
      <div class="portfolio active" id="portfolio">
        <div class="project" onclick="openModal('Icons/Online_Banking.png', 'Online_Banking', 'Streamlines communication and resource sharing for schools.', 'React, Node.js, MongoDB', 'https://github.com/NatBabi/Online-Banking')">
          <img src="Icons/Online_Banking.png" alt="Online_Banking" />
        </div>
        <div class="project" onclick="openModal('Icons/Expense-Tracker.png', 'Expense-Tracker', 'Empowers educators to manage and track e-learning content.', 'Python, Django, PostgreSQL', 'https://github.com/NatBabi/Expense-Tracker-CLI')">
          <img src="Icons/Expense-Tracker.png" alt="Expense-Tracker" />
        </div>
        <div class="project" onclick="openModal('Icons/Workout-tracker.jpg', 'Workout-tracker', 'A simple Node.js & Express-based web application to log and track workouts.', 'AWS, React, Express', 'https://github.com/NatBabi/Workout-Tracker-Web-App')">
          <img src="Icons/Workout-tracker.jpg" alt="Workout-tracker" />
        </div>
      </div>

      <div class="skills" id="skills">
        <div class="skills-grid">
          <div class="skill-card"><i class="fa-brands fa-html5"></i><span>HTML5</span></div>
          <div class="skill-card"><i class="fa-brands fa-css3-alt"></i><span>CSS3</span></div>
          <div class="skill-card"><i class="fa-brands fa-js"></i><span>JavaScript</span></div>
          <div class="skill-card"><i class="fa-brands fa-react"></i><span>React</span></div>
          <div class="skill-card"><i class="fa-brands fa-node-js"></i><span>Node.js</span></div>
          <div class="skill-card"><i class="fa-brands fa-php"></i><span>PHP</span></div>
          <div class="skill-card"><i class="fa-brands fa-python"></i><span>Python</span></div>
          <div class="skill-card"><i class="fa-brands fa-java"></i><span>Java</span></div>
        </div>
      </div>

      <footer>&copy; Natnael Tilahun, 2026. All rights reserved.</footer>
      </div>
    </div>

    <!-- Toast notification -->
    <div id="toast" class="toast" aria-live="polite"></div>

    <script src="Scripts.js"></script>
    
  </body>
</html>
